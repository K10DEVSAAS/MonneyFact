<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
  </defs>

  <!-- Background Dark Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="130" fill="#080C14" />

  <!-- Glowing Orange Border -->
  <rect x="16" y="16" width="480" height="480" rx="130" fill="none" stroke="url(#orangeGlow)" stroke-width="18" />
  <rect x="28" y="28" width="456" height="456" rx="118" fill="none" stroke="#FF5500" stroke-width="4" stroke-opacity="0.5" />

  <!-- Stylized M + Upward Arrow Icon -->
  <g fill="none" stroke="#F97316" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- M Paths -->
    <path d="M 136 352 V 200 L 224 300 L 312 200 V 352" />
    <!-- Arrow Shaft -->
    <path d="M 312 200 L 376 136" stroke="#FF6B00" />
    <!-- Arrow Head -->
    <path d="M 310 136 H 376 V 202" stroke="#FF6B00" stroke-width="40" />
  </g>
</svg>
